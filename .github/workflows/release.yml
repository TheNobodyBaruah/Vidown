name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: windows-x86_64.zip
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_suffix: linux-x86_64.tar.gz
            rustflags: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run automated tests
        run: cargo test --verbose --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Package release archive (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9] ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f 2)
          fi
          ARCHIVE="vidown-v${VERSION}-${{ matrix.archive_suffix }}"
          echo "Packaging $ARCHIVE..."
          cp "target/${{ matrix.target }}/release/vidown" .
          chmod +x vidown
          tar -czvf "$ARCHIVE" vidown README.md LICENSE
          mkdir -p dist
          mv "$ARCHIVE" dist/

      - name: Package release archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $refName = $env:GITHUB_REF_NAME
          if ($refName -match '^v?[0-9]') {
              $version = $refName -replace '^v', ''
          } else {
              $cargo = Get-Content Cargo.toml -Raw
              if ($cargo -match 'version\s*=\s*"([^"]+)"') {
                  $version = $matches[1]
              } else {
                  $version = "0.1.0"
              }
          }
          $archive = "vidown-v$version-${{ matrix.archive_suffix }}"
          Write-Host "Packaging $archive..."
          Copy-Item "target/${{ matrix.target }}/release/vidown.exe" -Destination .
          Compress-Archive -Path vidown.exe, README.md, LICENSE -DestinationPath $archive
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Move-Item $archive dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: dist
        run: |
          sha256sum vidown-* > checksums.txt
          cat checksums.txt

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ ^v?[0-9] ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ ! "$TAG" =~ ^v ]]; then
              TAG="v${TAG}"
            fi
          else
            CARGO_VER=$(grep '^version =' Cargo.toml | head -1 | cut -d '"' -f 2)
            TAG="v${CARGO_VER}"
          fi
          echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/vidown-*
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
